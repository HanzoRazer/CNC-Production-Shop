name: Release Candidate Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Distribution version already declared in pyproject.toml
        required: true
        type: string
      expected_commit:
        description: Optional 40-character commit SHA that HEAD must match
        required: false
        type: string
        default: ""
      release_state:
        description: Manifest state. Must remain release_candidate.
        required: false
        type: string
        default: release_candidate

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm expected commit
        if: ${{ inputs.expected_commit != '' }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          EXPECTED='${{ inputs.expected_commit }}'
          if [ "$HEAD_SHA" != "$EXPECTED" ]; then
            echo "RESULT: INVOCATION_ERROR"
            echo "expected_commit does not match workflow HEAD; this is not a release-eligibility blocker."
            echo "- HEAD $HEAD_SHA does not match expected_commit $EXPECTED"
            exit 3
          fi

      - name: Reject unauthorized release_state
        run: |
          if [ '${{ inputs.release_state }}' != 'release_candidate' ]; then
            echo "RESULT: INVOCATION_ERROR"
            echo "unauthorized release_state is a configuration error, not an eligibility blocker."
            echo "- automation will not emit release_state=${{ inputs.release_state }}"
            exit 3
          fi

      - name: Lint with ruff
        run: ruff check .

      - name: Type check
        run: |
          mypy business --ignore-missing-imports
          mypy musical_spatial_mapping --strict
          mypy cnc_version --strict
          mypy scripts/release --ignore-missing-imports

      - name: Test with pytest
        run: pytest --cov=business --cov-report=term-missing --cov-fail-under=90

      - name: Validate fixtures
        run: |
          python scripts/validate_eco_loom_fixture.py
          python scripts/validate_eco_loom_project.py
          python scripts/validate_bid_fixtures.py
          python scripts/validate_bid_summaries.py
          python scripts/validate_proposals.py
          python scripts/validate_guitar_estimates.py
          python scripts/validate_thin_skin_estimates.py
          python scripts/validate_smart_guitar_geometry.py
          python scripts/validate_neck_make_or_buy.py
          python scripts/validate_neck_quality.py
          python scripts/validate_release_manifests.py

      - name: Build and verify release candidate
        env:
          CI: "true"
        run: |
          set +e
          python scripts/release/build_release_candidate.py \
            --version '${{ inputs.version }}' \
            --output-dir dist-release-candidate \
            --test-summary "pytest passed on Python ${{ matrix.python-version }} (CI)" \
            --ci-summary "github-actions run ${{ github.run_id }} python ${{ matrix.python-version }}" \
            --expected-commit '${{ inputs.expected_commit }}' \
            --release-state '${{ inputs.release_state }}'
          ORCHESTRATOR_RC=$?
          set -e
          if [ "$ORCHESTRATOR_RC" -eq 3 ]; then
            echo "RESULT: INVOCATION_ERROR"
            echo "- build_release_candidate.py rejected the invocation; no candidate was evaluated"
            exit 3
          fi
          python scripts/release/classify_candidate_result.py \
            --evidence-dir dist-release-candidate

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.python-version }}
          path: dist-release-candidate/
          retention-days: 14
          if-no-files-found: ignore

  summarize:
    name: Report candidate disposition
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Aggregate candidate disposition
        run: |
          # Consumes semantic evidence: READY_FOR_TAG | BLOCKED | FAILED.
          # BLOCKED is a valid verification outcome, not a verification malfunction.
          echo "3.11 / 3.12 matrix job result: ${{ needs.verify.result }}"
          python scripts/release/classify_candidate_result.py \
            --aggregate artifacts \
            --verify-result '${{ needs.verify.result }}'
